    <script>
        let websocket;

        function connectWebSocket() {
            websocket = new WebSocket("ws://localhost:8765");

            websocket.onopen = function(event) {
                console.log("WebSocket is open now.");
            };

            websocket.onclose = function(event) {
                console.log("WebSocket is closed now.");
            };

            websocket.onmessage = function(event) {
                console.log("WebSocket message received:", event.data);
                const data = JSON.parse(event.data);
                const statusDisplay = document.getElementById("statusDisplay");

                if (data.status === "listening") {
                    statusDisplay.innerHTML = "Listening...";
                } else if (data.status === "processing") {
                    statusDisplay.innerHTML = "Thinking...";
                } else if (data.status === "responding") {
                    statusDisplay.innerHTML = "";
                }
            };

            websocket.onerror = function(event) {
                console.error("WebSocket error observed:", event);
            };
        }

        function sendWebSocketMessage(status) {
            if (websocket && websocket.readyState === WebSocket.OPEN) {
                const message = JSON.stringify({ command: status });
                websocket.send(message);
                console.log(`Sent: ${message}`);

                const statusDisplay = document.getElementById("statusDisplay");
                if (status === "on") {
                    statusDisplay.innerHTML = '<div class="spinner-border" role="status"><span class="sr-only">Loading...</span></div>';
                } else if (status === "off") {
                    statusDisplay.innerHTML = "";
                }
            } else {
                console.error("WebSocket is not open. Unable to send message.");
            }
        }

        // Connect to WebSocket when the page loads
        window.onload = connectWebSocket;
    </script>
